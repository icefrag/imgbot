[project]
name = "imgbot"
version = "0.1.0"
description = "双目标图色脚本基础库(PC窗口 + 安卓模拟器): 模板/多点找色/区域找色/OCR/逐字读数/拟人键鼠/Target双后端"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "rapidocr-onnxruntime>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imgbot"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
python-install-mirror = "https://mirrors.cloud.tencent.com/python-build-standalone"
