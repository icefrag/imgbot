<h1>KeyPress</h1>
<p class='sec'>函数简介:</p>
<p>按一次键(按下+抬起, 扫描码配方+手动 TranslateMessage)。前台通道打字走 UNICODE(IME 免疫); L/R 修饰键自动归一化为通用码。</p>
<p class='sec'>函数原型:</p>
<pre>KeyPress(vk)</pre>
<p class='sec'>参数定义:</p>
<p>vk <span class='maroon'>整形数</span> <b class='req'>【必传】</b>: 虚拟键码(0x41=A, 0x70=F1)</p>
<p class='sec'>返回值:</p>
<p><span class='maroon'>整形数: 1</span></p>
<p class='sec'>示例:</p>
<pre>dm.KeyPress(0x1B)  # ESC</pre>
