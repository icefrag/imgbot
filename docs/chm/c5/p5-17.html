<h1>probe</h1>
<p class='sec'>函数简介:</p>
<p>单帧多图探测: 返回第一张存在的模板名, 全无 None。</p>
<p class='sec'>函数原型:</p>
<pre>ops.probe(*pics, region=None, threshold=None)</pre>
<p class='sec'>参数定义:</p>
<p>pics <span class='maroon'>列表</span> <b class='req'>【必传】</b>: 模板名(可传多个)<br>region <span class='maroon'>元组</span> <b class='opt'>【可选, 默认 None】</b>: 搜索矩形<br>threshold <span class='maroon'>浮点数</span> <b class='opt'>【可选, 默认 None】</b>: 相似度</p>
<p class='sec'>返回值:</p>
<p><span class='maroon'>名字 或 None</span></p>
<p class='sec'>示例:</p>
<pre>which = ops.probe("升级.png", "断线.png", region=POPUP)</pre>
