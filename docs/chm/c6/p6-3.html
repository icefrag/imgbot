<h1>模板制作约定</h1>

<ul>
<li>一律 <b>PNG</b>(无损+透明通道), 文件名即模板名;</li>
<li><b>四角即底色自动键控</b>: 3 通道 PNG 四角(≥3/4)同色 → 载入自动转透明模板,</li>
</ul>
<p>  匹配只比笔画 —— 悬浮元素裁图后背景填统一纯色即可, 不用手工抠图;</p>
<ul>
<li>元素自带闪光/呼吸灯 → 只裁稳定核心(文字笔画/图标主体);</li>
<li><b>位置固定的 UI(弹窗角上的 X 等)必须在固定矩形内搜索</b>(region),</li>
</ul>
<p>  否则画面其他亮色图案会误报(实测关 X 全屏搜在翅膀上得 0.94);</p>
<ul>
<li>多点找色素材用 pixpick 选点(tools/pixpick)。</li>
</ul>
