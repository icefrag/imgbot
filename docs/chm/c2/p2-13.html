<h1>IsDisplayDead</h1>
<p class='sec'>函数简介:</p>
<p>区域 t 秒画面不变返回 1(卡屏检测)。</p>
<p class='sec'>函数原型:</p>
<pre>IsDisplayDead(x1, y1, x2, y2, t=2)</pre>
<p class='sec'>参数定义:</p>
<p>x1 <span class='maroon'>整形数</span> <b class='req'>【必传】</b>: 监测区域<br>y1 <span class='maroon'>整形数</span> <b class='req'>【必传】</b>: 监测区域<br>x2 <span class='maroon'>整形数</span> <b class='req'>【必传】</b>: 监测区域<br>y2 <span class='maroon'>整形数</span> <b class='req'>【必传】</b>: 监测区域<br>t <span class='maroon'>整形数</span> <b class='opt'>【可选, 默认 2】</b>: 判定秒数</p>
<p class='sec'>返回值:</p>
<p><span class='maroon'>整形数: 1/0</span></p>
<p class='sec'>示例:</p>
<pre>if dm.IsDisplayDead(0, 0, 800, 600, 3): ...  # 卡了3秒</pre>
